[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "imfeat"
version = "0.1.0"
description = "Fast single-pass image feature extraction: moments + gradient structure statistics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "numpy", "opencv-python"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/imfeat"]

[tool.pytest.ini_options]
markers = [
  "bench: benchmarks (timings printed with -s); skip with -m \"not bench\"",
  "full: needs reference libraries (cv2, imagehash, PIL, scipy); enabled by --full",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "scipy", "scipy.*", "imagehash", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `mypy src tests`: the tests are unannotated by design; their bodies are still checked.
module = ["bard_cases", "bard_oracle", "bard_quality", "conftest", "test_bard", "test_bench", "test_color", "test_descriptors", "test_edges", "test_hash_cross", "test_lbp", "test_moments", "test_outputs", "test_resize", "test_struct", "test_summary", "test_texture", "test_threads"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
